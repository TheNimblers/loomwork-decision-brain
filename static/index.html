<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Loomwork Decision Brain</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f0f0f; color: #fff; line-height: 1.5; }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 20px; font-size: 24px; }
    h2 { font-size: 18px; margin: 0 0 12px; color: #ddd; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .panel { background: #1a1a1a; border-radius: 8px; padding: 16px; border: 1px solid #333; }
    .panel.full { grid-column: 1 / -1; }
    label { display: block; margin: 10px 0 4px; color: #aaa; font-size: 14px; }
    input, textarea, select { width: 100%; background: #111; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 8px; font-family: inherit; }
    textarea { min-height: 120px; resize: vertical; }
    button { background: #B84800; color: #fff; border: none; border-radius: 6px; padding: 8px 16px; cursor: pointer; font-weight: 600; }
    button:hover { background: #d45200; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .badge.green { background: #1f6f1f; }
    .badge.amber { background: #b8860b; }
    .badge.red { background: #8b1a1a; }
    .citation { display: inline-block; vertical-align: super; font-size: 10px; font-family: monospace; background: #2a1a10; color: #e07a3a; border: 1px solid #5a2e10; border-radius: 3px; padding: 0 4px; line-height: 1.6; margin: 0 1px; cursor: default; }
    .contradiction { background: #2a1a10; border-left: 4px solid #B84800; padding: 12px; margin: 12px 0; }
    .quote { color: #ccc; font-style: italic; margin: 6px 0; }
    .decision { border-top: 1px solid #333; padding: 12px 0; }
    .actions { margin-top: 8px; }
    .actions button { margin-right: 8px; }
    .muted { color: #888; font-size: 14px; }
    pre { white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Loomwork Decision Brain</h1>
    <div class="grid">
      <div class="panel">
        <h2>Ingest</h2>
        <label>Title</label>
        <input id="title" value="Manual document">
        <label>Source type</label>
        <select id="source_type">
          <option>board_note</option>
          <option>investor_update</option>
          <option>call_transcript</option>
          <option>internal_email</option>
          <option>email</option>
          <option>social_post</option>
        </select>
        <label>Date</label>
        <input id="doc_date" type="date">
        <label>Content</label>
        <textarea id="content" placeholder="Paste document content here..."></textarea>
        <button onclick="ingest()">Ingest</button>
        <div id="ingest_result"></div>
      </div>

      <div class="panel">
        <h2>Query</h2>
        <label>Question</label>
        <textarea id="question">What runway can I defend in this week's investor update?</textarea>
        <button onclick="query()">Ask</button>
        <div id="query_result"></div>
      </div>

      <div class="panel full">
        <h2>Contradictions</h2>
        <div id="contradictions">No contradictions loaded.</div>
      </div>

      <div class="panel full">
        <h2>Decision Log</h2>
        <div id="decisions">No decisions loaded.</div>
      </div>
    </div>
  </div>

  <script>
    const API = '/brain';

    async function ingest() {
      const payload = {
        title: document.getElementById('title').value,
        source_type: document.getElementById('source_type').value,
        content: document.getElementById('content').value,
        document_date: document.getElementById('doc_date').value || null
      };
      const res = await fetch(`${API}/ingest`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const data = await res.json();
      document.getElementById('ingest_result').innerHTML = `<p class="muted">${data.facts_extracted} facts extracted, ${data.contradictions_detected} contradictions. Already existed: ${data.already_existed}</p>`;
      loadContradictions();
    }

    function badgeClass(conf) {
      if (conf >= 0.70) return 'green';
      if (conf >= 0.50) return 'amber';
      return 'red';
    }

    function renderSynthesis(text) {
      // Render [hexid] as a superscript citation badge showing first 6 chars
      return text.replace(/\[([a-f0-9]{6,16})\]/g, (_, id) =>
        `<span class="citation" title="${id}">${id.slice(0, 6)}</span>`
      );
    }

    async function query() {
      // Issue 3 fix: validate before sending — show clear feedback on empty question
      const q = document.getElementById('question').value.trim();
      if (!q) {
        document.getElementById('query_result').innerHTML = '<p style="color:#e05;font-weight:600;">Question cannot be empty.</p>';
        return;
      }

      const btn = document.querySelector('.panel:nth-child(2) button');
      btn.disabled = true;
      btn.textContent = 'Thinking…';

      let data, res;
      try {
        res = await fetch(`${API}/query`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: q }) });
        data = await res.json();
      } catch (e) {
        document.getElementById('query_result').innerHTML = '<p style="color:#e05;">Network error — is the server running?</p>';
        btn.disabled = false; btn.textContent = 'Ask';
        return;
      } finally {
        btn.disabled = false; btn.textContent = 'Ask';
      }

      if (!res.ok) {
        document.getElementById('query_result').innerHTML = `<p style="color:#e05;font-weight:600;">Error ${res.status}: ${data.detail || 'Unknown error'}</p>`;
        return;
      }

      let html = `<p><span class="badge ${badgeClass(data.confidence)}">Confidence: ${data.confidence}</span> ${data.research_triggered ? '<span class="badge amber">Tavily researched</span>' : ''}</p>`;
      html += `<p><strong>Recommended action:</strong> ${data.recommended_action}</p>`;
      if (data.key_contradiction) html += `<div class="contradiction"><strong>Key contradiction:</strong> ${data.key_contradiction}</div>`;
      html += `<pre>${renderSynthesis(data.synthesis)}</pre>`;
      if (data.open_gaps && data.open_gaps.length) html += `<p class="muted"><strong>Open gaps:</strong> ${data.open_gaps.join('; ')}</p>`;
      document.getElementById('query_result').innerHTML = html;

      // Issue 1 fix: loadDecisions() is called AFTER the query() response already contains the
      // new decision_id — meaning the INSERT is committed before we get here. Safe to load now.
      loadDecisions();
    }

    async function loadContradictions() {
      const res = await fetch(`${API}/contradictions`);
      const cs = await res.json();
      if (!cs.length) return document.getElementById('contradictions').innerText = 'No contradictions.';
      // Sort: smallest min-value first; tiebreak by smaller max-value first.
      // Result: (18 vs 9) → (9 vs 24) → (18 vs 24). The direct Northpeak→BoardNote pair leads.
      const sorted = [...cs].sort((a, b) => {
        const minA = Math.min(a.fact_a_value ?? Infinity, a.fact_b_value ?? Infinity);
        const minB = Math.min(b.fact_a_value ?? Infinity, b.fact_b_value ?? Infinity);
        if (minA !== minB) return minA - minB;
        const maxA = Math.max(a.fact_a_value ?? 0, a.fact_b_value ?? 0);
        const maxB = Math.max(b.fact_a_value ?? 0, b.fact_b_value ?? 0);
        return maxA - maxB;
      });
      document.getElementById('contradictions').innerHTML = sorted.map(c => `
        <div class="contradiction">
          <strong>${c.severity.toUpperCase()}:</strong> ${c.description}<br>
          <div class="quote">A: ${c.fact_a_quote}</div>
          <div class="quote">B: ${c.fact_b_quote}</div>
        </div>
      `).join('') + `<p class="muted">${cs.length} contradiction(s) total.</p>`;
    }

    async function decide(id, decision, btn) {
      btn.disabled = true;
      const res = await fetch(`${API}/decisions/${id}/decide`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ decision }) });
      const data = await res.json();
      if (!res.ok) { alert(data.detail || 'Error'); btn.disabled = false; }
      loadDecisions();
    }

    async function loadDecisions() {
      const res = await fetch(`${API}/decisions`);
      const ds = await res.json();
      const el = document.getElementById('decisions');
      if (!ds.length) return el.innerText = 'No decisions.';
      // Issue 2 fix: show full synthesis text — no substring truncation
      el.innerHTML = ds.map(d => `
        <div class="decision">
          <strong>${new Date(d.created_at).toLocaleString()}</strong>
          <span class="badge ${d.human_decision ? 'green' : 'amber'}">${d.human_decision || 'pending'}</span>
          <p class="muted">${d.question}</p>
          <pre style="font-size:13px;max-height:200px;overflow-y:auto;">${renderSynthesis(d.synthesis)}</pre>
          ${d.human_decision ? '' : `<div class="actions"><button onclick="decide('${d.id}', 'approved', this)">Approve</button><button onclick="decide('${d.id}', 'rejected', this)">Reject</button></div>`}
        </div>
      `).join('');
    }

    loadContradictions();
    loadDecisions();
  </script>
</body>
</html>
